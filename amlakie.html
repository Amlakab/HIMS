<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration with Specific ID</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
        /* Custom animation for modals */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <!-- Buttons -->
        <button class="btn btn-primary" onclick="passIdToURL('register', 101)">Register for ID 101</button>
        <button class="btn btn-primary" onclick="passIdToURL('register', 102)">Register for ID 102</button>
        <button class="btn btn-secondary" onclick="passIdToURL('verify', 101)">Verify ID 101</button>
        <button class="btn btn-secondary" onclick="passIdToURL('verify', 102)">Verify ID 102</button>
    </div>

    <!-- Modal for Registration -->
    <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content fade-in">
                <div class="modal-header">
                    <h5 class="modal-title" id="registerModalLabel">User Registration</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="registerModalBody">
                    <form id="registrationForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" placeholder="Enter username">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="Enter email">
                        </div>
                        <button type="button" class="btn btn-primary" onclick="submitRegistration()">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Verification -->
    <div class="modal fade" id="verifyModal" tabindex="-1" aria-labelledby="verifyModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content fade-in">
                <div class="modal-header">
                    <h5 class="modal-title" id="verifyModalLabel">Verify User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="verifyModalBody">
                    <!-- Content dynamically updated based on ID -->
                </div>
            </div>
        </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script>
        /**
         * Pass the specific action ('register' or 'verify') and ID to the URL.
         * @param {string} action - The action to perform ('register' or 'verify').
         * @param {number} id - The specific ID to include in the URL.
         */
        function passIdToURL(action, id) {
            const newUrl = `${window.location.origin}${window.location.pathname}?action=${action}&id=${id}`;
            window.history.pushState({}, '', newUrl);
            handleModal(action, id);
        }

        /**
         * Open the appropriate modal and display content based on the ID.
         * @param {string} action - The action ('register' or 'verify').
         * @param {number} id - The specific ID.
         */
        function handleModal(action, id) {
            if (action === 'register') {
                document.getElementById('registerModalBody').innerHTML = `
                    <p>Registering for ID: <strong>${id}</strong></p>
                    <form id="registrationForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" placeholder="Enter username">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="Enter email">
                        </div>
                        <button type="button" class="btn btn-primary" onclick="submitRegistration(${id})">Register</button>
                    </form>
                `;
                const registerModal = new bootstrap.Modal(document.getElementById('registerModal'));
                registerModal.show();
            } else if (action === 'verify') {
                document.getElementById('verifyModalBody').innerText = `Verifying details for ID: ${id}`;
                const verifyModal = new bootstrap.Modal(document.getElementById('verifyModal'));
                verifyModal.show();
            }
        }

        /**
         * Simulate a registration submission.
         * @param {number} id - The ID being registered.
         */
        function submitRegistration(id) {
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;

            if (username && email) {
                alert(`Registration successful!\nID: ${id}\nUsername: ${username}\nEmail: ${email}`);
                // Reset form
                document.getElementById('registrationForm').reset();
                const registerModal = bootstrap.Modal.getInstance(document.getElementById('registerModal'));
                registerModal.hide();
            } else {
                alert('Please fill in all fields.');
            }
        }

        /**
         * Trigger modal display based on the URL query parameters on page load.
         */
        function handlePageLoad() {
            const urlParams = new URLSearchParams(window.location.search);
            const action = urlParams.get('action');
            const id = urlParams.get('id');

            if (action && id) {
                handleModal(action, id);
            }
        }

        // Handle modal display on page load
        window.onload = handlePageLoad;
    </script>
</body>
</html>
