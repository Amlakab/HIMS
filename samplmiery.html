<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page with 30-Second Loading Spinner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Full-screen loading spinner styling */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .table-container {
            display: none; /* Hide the table initially until the spinner finishes */
        }
    </style>
</head>
<body>
    <!-- Loading Spinner -->
    <div class="loading-overlay">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- Table -->
     <div class="container table-container">
        <h1 class="text-center mb-4">Data Table</h1>
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>John Doe</td>
                    <td>john@example.com</td>
                    <td>123-456-7890</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Jane Smith</td>
                    <td>jane@example.com</td>
                    <td>987-654-3210</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Bob Johnson</td>
                    <td>bob@example.com</td>
                    <td>555-123-4567</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // Ensure spinner is visible for 30 seconds
           setTimeout(() => {
            // Hide the loading spinner
            document.querySelector('.loading-overlay').style.display = 'none';

            // Show the table
            document.querySelector('.table-container').style.display = 'block';
        }, 30000); // 30,000 milliseconds = 30 seconds
    </script>
</body>
</html>
